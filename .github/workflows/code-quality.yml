name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Turbo output
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: |
          npx turbo run lint --output-logs=errors-only > lint-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat lint-output.txt

      - name: Run Type Check
        id: typecheck
        continue-on-error: true
        run: |
          npx turbo run check-types --output-logs=errors-only > typecheck-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat typecheck-output.txt

      - name: Reviewdog inline annotations (ESLint)
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s lint-output.txt ]; then
            cat lint-output.txt | reviewdog -f=eslint -name="ESLint" -reporter=github-pr-review -filter-mode=added -fail-level=none
          fi

      - name: Reviewdog inline annotations (tsc)
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s typecheck-output.txt ]; then
            cat typecheck-output.txt | reviewdog -f=tsc -name="Type Check" -reporter=github-pr-review -filter-mode=added -fail-level=none
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-logs
          path: |
            lint-output.txt
            typecheck-output.txt

      - name: Post Code Quality Summary Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lintExit = '${{ steps.lint.outputs.exit_code }}';
            const typeExit = '${{ steps.typecheck.outputs.exit_code }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueNumber = context.payload.pull_request?.number ?? context.issue.number;

            if (!issueNumber) {
              core.info('No pull request context available; skipping PR comment.');
              return;
            }

            const row = (name, exit) => exit === '0'
              ? `| ${name} | ✅ Passed | [View](${runUrl}) |`
              : `| ${name} | ❌ Failed | [View](${runUrl}) |`;

            const allPassed = lintExit === '0' && typeExit === '0';

            const comment = [
              allPassed ? '## ✅ Code Quality Review Success' : '## ❌ Code Quality Review Failed',
              '',
              allPassed
                ? 'All checks passed successfully in the latest run. Below is the summary of results:'
                : 'Some checks failed in the latest run. Below is the summary of results:',
              '',
              '| Check | Status | Details |',
              '|---|---|---|',
              row('eslint', lintExit),
              row('tsc', typeExit),
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Code Quality Review')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment,
              });
            }

      - name: Fail if any check failed
        if: always()
        run: |
          if [ "${{ steps.lint.outputs.exit_code }}" != "0" ] || \
             [ "${{ steps.typecheck.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi